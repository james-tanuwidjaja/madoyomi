# Madoyomi's mpv config. The backend starts mpv with --config-dir pointing here (the repo's player/ in dev, the
# bundled copy in release), so the user's own %APPDATA%\mpv config isn't read.
# Per-session options (headers, title, subtitles, audio tracks, the source's mpv options, the IPC pipe, the start
# time) are set by the backend on the command line and in the session's include file: see IPC.md.

# Madoyomi saves progress itself (over IPC, Phase 4 Stage 2): no watch_later files.
save-position-on-quit=no
# Quit at the end of the file, so the backend sees the end and offers the next episode.
keep-open=no

# Streams: a larger demuxer cache for HLS and slow hosts.
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB

hwdec=auto-safe
osc=yes
