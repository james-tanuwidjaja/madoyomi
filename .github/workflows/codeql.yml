# Code scanning with CodeQL (advanced setup; GitHub's default setup must stay off, or this workflow's results are
# refused). Runs on pushes and pull requests to main, weekly, and by hand.
#
# - actions, javascript-typescript and rust need no build (build-mode none).
# - java-kotlin compiles the backend (server/, a Gradle build) with JDK 21: only `classes`, so no tests, no ktlint
#   (upstream makes every Kotlin compile depend on ktlintFormat, hence -x ktlintFormat) and no fetch scripts, which
#   only restore fonts and test images. Kotlin already compiles in-process (server/gradle.properties), so the compiler
#   runs inside the build CodeQL traces; --no-build-cache keeps every compile task running. server/gradlew is
#   tracked without the executable bit, hence `bash ./gradlew`.
# - spikes/ (early throwaway experiments, never shipped) isn't scanned. Its Gradle project isn't built here either.
# - The query suite is the default one, as in the default setup, and each language's category is
#   "/language:<language>", also the default setup's, so its alerts carry over.
# Actions are pinned by commit (the tag in the comment), as in release.yml.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    env:
      JAVA_VERSION: "21.0.13"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin)
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          java-package: jdk

      - name: Set up Gradle (dependency cache)
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - spikes

      - name: "Build: server (compile only)"
        if: matrix.build-mode == 'manual'
        working-directory: server
        run: bash ./gradlew --no-daemon --no-build-cache --console=plain classes -x ktlintFormat

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
