# Madoyomi: build settings for server/.
# Upstream gitignores this file and its CI copies in .github/runner-files/ci-gradle.properties.
# Without the larger heap, :server:compileKotlin fails with "OutOfMemoryError: GC overhead limit exceeded".
org.gradle.jvmargs=-Xmx5120m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
